<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat Agent · Gennexbyte Office</title>
  <link rel="stylesheet" href="./chat.css">
</head>
<body>
  <div id="scrim"></div>
  <aside id="side">
    <nav id="rail" aria-label="Agent"></nav>
    <div id="convs">
      <div class="convs-head">
        <div><b id="side-name">Agent</b><small id="side-role"></small></div>
        <button id="new" class="icon" title="Percakapan baru" aria-label="Percakapan baru">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div id="sessions"></div>
      <a class="back" href="./">← Kembali ke kantor 3D</a>
    </div>
  </aside>
  <main id="main">
    <header id="head">
      <button id="menu" class="icon" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      <span id="head-av" class="av"></span>
      <div class="head-txt"><h1 id="title">Memuat…</h1><div id="sub"></div></div>
    </header>
    <section id="log" aria-live="polite"></section>
    <div id="dock">
      <div id="banner" hidden></div>
      <form id="composer">
        <textarea id="text" rows="1" placeholder="Tulis perintah…"></textarea>
        <button type="button" id="stop" class="send stop" title="Hentikan" aria-label="Hentikan" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
        <button type="submit" id="send" class="send" title="Kirim" aria-label="Kirim">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
      <small class="keys">Enter kirim · Shift+Enter baris baru · perubahan di server selalu minta persetujuanmu dulu</small>
    </div>
  </main>
  <div id="login" hidden><form id="login-form"><b>Masuk admin</b><input id="token" type="password" placeholder="Token admin" autocomplete="current-password" required><button class="primary">Masuk</button><small id="login-err"></small></form></div>
  <script type="module" src="./chat.js"></script>
</body>
</html>
